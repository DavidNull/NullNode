extends: default

rules:
  line-length:
    max: 120
    level: warning
  comments:
    min-spaces-from-content: 1
  truthy:
    # GitHub Actions
    allowed-values: ["true", "false", "on", "off"]
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: consistent

ignore: |
  **/templates/**
