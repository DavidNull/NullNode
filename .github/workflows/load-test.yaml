name: Load test

on:
  workflow_dispatch:
    inputs:
      gateway:
        description: Gateway base URL
        required: true
        default: http://gateway.nullnode.localhost:8080
      model:
        description: Model to exercise
        required: true
        default: llama3.2

permissions:
  contents: read

jobs:
  k6:
    name: k6 against an existing gateway
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the gateway key
        id: key
        run: |
          key="$(terraform -chdir=infra/terraform/platform-bootstrap \
                   output -raw litellm_master_key)"
          echo "::add-mask::${key}"
          echo "value=${key}" >> "$GITHUB_OUTPUT"

      - uses: grafana/setup-k6-action@v1

      - name: Run the load profile
        env:
          GATEWAY: ${{ inputs.gateway }}
          MODEL: ${{ inputs.model }}
          API_KEY: ${{ steps.key.outputs.value }}
        run: |
          k6 run tests/load/chat-completions.js \
            -e GATEWAY="$GATEWAY" \
            -e MODEL="$MODEL" \
            -e API_KEY="$API_KEY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: k6-summary.json
