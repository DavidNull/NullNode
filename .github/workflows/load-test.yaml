name: Load test

# Not part of CI: this needs a converged platform and takes ~10 minutes of
# sustained inference. Run it against a lab on demand.
on:
  workflow_dispatch:
    inputs:
      gateway:
        description: Gateway base URL
        required: true
        default: http://gateway.nullnode.localhost:8080
      model:
        description: Model to exercise
        required: true
        default: llama3.2

permissions:
  contents: read

jobs:
  k6:
    name: k6 against an existing gateway
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the gateway key
        id: key
        run: |
          key="$(terraform -chdir=infra/terraform/platform-bootstrap \
                   output -raw litellm_master_key)"
          echo "::add-mask::${key}"
          echo "value=${key}" >> "$GITHUB_OUTPUT"

      - uses: grafana/setup-k6-action@v1

      - name: Run the load profile
        run: |
          k6 run tests/load/chat-completions.js \
            -e GATEWAY='${{ inputs.gateway }}' \
            -e MODEL='${{ inputs.model }}' \
            -e API_KEY='${{ steps.key.outputs.value }}'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: k6-summary.json
