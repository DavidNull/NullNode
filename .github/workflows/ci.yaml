name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: Helm lint & render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kubeconform
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Lint and render every chart
        run: ./scripts/validate.sh helm

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Validate both stacks
        run: ./scripts/validate.sh terraform

  static:
    name: Shell, YAML & Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pipx install yamllint

      - run: ./scripts/validate.sh shell
      - run: ./scripts/validate.sh yaml
      - run: ./scripts/validate.sh python

  # The full platform needs a GPU and tens of GiB of model weights, neither of
  # which a hosted runner has. This job proves the CPU profile converges far
  # enough to serve a real completion from a 1B model.
  integration:
    name: CPU-profile integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.7.4 bash

      - name: Free up disk space
        # Model weights plus the observability stack do not fit next to the
        # runner's preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Bring the platform up (CPU profile)
        env:
          PROFILE: cpu
          # ArgoCD reconciles from the pushed revision, not the working tree.
          TF_VAR_gitops_target_revision: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/up.sh

      - name: Smoke test
        env:
          PROFILE: cpu
        run: ./scripts/smoke.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== Cluster Resources ==="
          kubectl get pods -A -o wide || true
          echo "=== ArgoCD Applications ==="
          kubectl -n argocd get applications -o wide || true
          echo "=== NullNode Root Application Details ==="
          kubectl -n argocd get application nullnode-root -o yaml || true
          echo "=== ArgoCD Controller Logs ==="
          kubectl -n argocd logs deployment/argocd-application-controller -c argocd-application-controller --tail=100 || true
          echo "=== ArgoCD Repo Server Logs ==="
          kubectl -n argocd logs deployment/argocd-repo-server -c argocd-repo-server --tail=100 || true
          echo "=== Platform Resources ==="
          kubectl -n nullnode-platform describe pods || true
          kubectl -n nullnode-platform logs deployment/litellm --tail=200 || true
          kubectl -n nullnode-platform logs statefulset/ollama --tail=200 || true

      - name: Tear down
        if: always()
        run: ./scripts/down.sh --purge || true
