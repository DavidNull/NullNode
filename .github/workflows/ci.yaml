name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: Helm lint & render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kubeconform
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Lint and render every chart
        run: ./scripts/validate.sh helm

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Validate both stacks
        run: ./scripts/validate.sh terraform

  static:
    name: Shell, YAML & Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pipx install yamllint

      - run: ./scripts/validate.sh shell
      - run: ./scripts/validate.sh yaml
      - run: ./scripts/validate.sh python

  core-integration:
    name: Core integration (datastores + GitOps sync)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.7.4 bash

      # Datastores + GitOps sync only (CORE_ONLY): no ollama, gateway or the
      # full observability stack, so this fits a standard hosted runner. The
      # heavy end-to-end lives in the workflow_dispatch `integration` job.
      - name: Bring up the core (CPU profile, datastores only)
        env:
          PROFILE: cpu
          CORE_ONLY: "true"
          TF_VAR_gitops_target_revision: main
        run: ./scripts/up.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== Cluster Resources ==="
          kubectl get pods -A -o wide || true
          echo "=== ArgoCD Applications ==="
          kubectl -n argocd get applications -o wide || true
          echo "=== NullNode Root Application Details ==="
          kubectl -n argocd get application nullnode-root -o yaml || true
          echo "=== ArgoCD Controller Logs ==="
          kubectl -n argocd logs deployment/argocd-application-controller -c argocd-application-controller --tail=100 || true
          echo "=== ArgoCD Repo Server Logs ==="
          kubectl -n argocd logs deployment/argocd-repo-server -c argocd-repo-server --tail=100 || true
          echo "=== Datastore Resources ==="
          kubectl -n nullnode-platform describe pods || true

      - name: Tear down
        if: always()
        run: ./scripts/down.sh --purge || true

  integration:
    name: Full CPU-profile integration (manual)
    # Heavy end-to-end: pulls several GiB of images plus a model and needs
    # ~4 CPU of requests (ollama alone asks for 2). Too much for the standard
    # push/PR runner, so it is opt-in via the Actions "Run workflow" button.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.7.4 bash

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Bring the platform up (CPU profile)
        env:
          PROFILE: cpu
          TF_VAR_gitops_target_revision: main
        run: ./scripts/up.sh

      - name: Smoke test
        env:
          PROFILE: cpu
        run: ./scripts/smoke.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== Cluster Resources ==="
          kubectl get pods -A -o wide || true
          echo "=== ArgoCD Applications ==="
          kubectl -n argocd get applications -o wide || true
          echo "=== NullNode Root Application Details ==="
          kubectl -n argocd get application nullnode-root -o yaml || true
          echo "=== ArgoCD Controller Logs ==="
          kubectl -n argocd logs deployment/argocd-application-controller -c argocd-application-controller --tail=100 || true
          echo "=== ArgoCD Repo Server Logs ==="
          kubectl -n argocd logs deployment/argocd-repo-server -c argocd-repo-server --tail=100 || true
          echo "=== Platform Resources ==="
          kubectl -n nullnode-platform describe pods || true
          kubectl -n nullnode-platform logs deployment/litellm --tail=200 || true
          kubectl -n nullnode-platform logs statefulset/ollama --tail=200 || true

      - name: Tear down
        if: always()
        run: ./scripts/down.sh --purge || true
