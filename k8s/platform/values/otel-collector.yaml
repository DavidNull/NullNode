# Upstream opentelemetry-collector values. Two jobs:
#   1. Terminate LiteLLM's OTLP traces.
#   2. Derive RED metrics from them (spanmetrics), the fallback if LiteLLM's
#      Prometheus callback is unavailable on the pinned version.

mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  kubernetesAttributes:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  prom-exporter:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

serviceMonitor:
  enabled: true
  extraLabels:
    release: kube-prometheus-stack
  metricsEndpoints:
    - port: prom-exporter
      interval: 15s

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 5s
      send_batch_size: 512
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 20

  connectors:
    spanmetrics:
      namespace: nullnode
      histogram:
        explicit:
          buckets: [50ms, 200ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s]
      dimensions:
        - name: gen_ai.request.model
        - name: gen_ai.system
        - name: http.route

  exporters:
    prometheus:
      endpoint: 0.0.0.0:8889
      enable_open_metrics: true
      resource_to_telemetry_conversion:
        enabled: true
    debug:
      verbosity: basic

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [spanmetrics, debug]
      metrics:
        receivers: [otlp, spanmetrics]
        processors: [memory_limiter, batch]
        exporters: [prometheus]
