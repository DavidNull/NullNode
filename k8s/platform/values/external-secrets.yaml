# Upstream External Secrets Operator values.
#
# ESO replaces the Terraform "secrets bridge": instead of platform-bootstrap
# reading Secrets Manager with a data source and projecting Kubernetes Secrets
# (which only refreshed on `terraform apply`), the controller reconciles the
# same secret on an interval. See docs/adr/0007-external-secrets-operator.md.

# The CRDs (SecretStore, ClusterSecretStore, ExternalSecret, ...) ship with the
# chart; the ClusterSecretStore and ExternalSecrets that use them live in the
# external-secrets-config chart, one sync wave later.
installCRDs: true

replicaCount: 1

# The AWS provider has no endpoint field: the controller resolves endpoints
# from these env vars, which is how ESO is pointed at the mocked cloud. The
# host address k3d injects into CoreDNS, same one the workloads use.
extraEnv:
  - name: AWS_SECRETSMANAGER_ENDPOINT
    value: http://host.k3d.internal:4566
  - name: AWS_STS_ENDPOINT
    value: http://host.k3d.internal:4566

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    memory: 192Mi

# Scraped by kube-prometheus-stack. renderMode skipIfMissing (the chart default)
# means the ServiceMonitor is only emitted once the Prometheus CRD exists, so a
# cold first sync — or a core-only run without the observability stack — does
# not fail on a missing CRD.
serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
