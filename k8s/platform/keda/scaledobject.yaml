apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ollama-scaler
  namespace: platform
spec:
  scaleTargetRef:
    name: ollama
    apiVersion: apps/v1
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 300
  pollingInterval: 30
  triggers:
  - type: redis
    metadata:
      address: redis.platform.svc.cluster.local:6379
      listName: litellm:queue
      listLength: "5"
      activationListLength: "3"
