apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      {{- range .Values.modelList }}
      - model_name: {{ .model_name }}
        litellm_params:
          {{- toYaml .litellm_params | nindent 10 }}
      {{- end }}
    
    general_settings:
      {{- toYaml .Values.generalSettings | nindent 6 }}
    
    security_settings:
      api_key_validation: {{ .Values.security.apiKeyValidation }}
      quota_management: {{ .Values.security.quotaManagement }}
      rate_limiting: {{ .Values.security.rateLimiting }}
      pii_masking: {{ .Values.security.piiMasking }}
