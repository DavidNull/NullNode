# Injected by infra/terraform/platform-bootstrap. Change the Terraform
# variables, not this file.
gitops:
  repoURL: https://github.com/DavidNull/NullNode.git
  targetRevision: main
  path: k8s/platform

platform:
  # gpu | cpu - selects the platform values file layered on top.
  profile: gpu
  # Host suffix for every Ingress the platform creates.
  hostSuffix: nullnode.localhost
  # coreOnly: deploy datastores + GitOps sync only, skipping the heavy compute
  # (ollama, gateway) and the full observability stack. Used by the CI
  # core-integration job so it fits a small runner. See .github/workflows/ci.yaml.
  coreOnly: false

argocd:
  namespace: argocd
