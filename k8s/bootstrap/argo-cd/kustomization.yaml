apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

patches:
  - patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: http-webhook
          port: 4000
          targetPort: 4000
    target:
      kind: Service
      name: argocd-server
