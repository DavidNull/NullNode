{{- if .Values.global.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "nullnode-observability.fullname" . }}-external-secrets
  labels:
    {{- include "nullnode-observability.labels" . | nindent 4 }}
    release: {{ .Values.global.monitoring.releaseLabel }}
spec:
  groups:
    - name: external-secrets
      rules:
        - alert: ExternalSecretsHighErrorRate
          expr: |
            rate(external_secrets_secret_errors_total[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
            component: external-secrets
          annotations:
            summary: "External Secrets Operator high error rate"
            description: "External Secrets Operator is experiencing a high error rate for the last 5 minutes"

        - alert: ExternalSecretsSyncFailure
          expr: |
            external_secrets_secret_sync_errors_total > 0
          for: 10m
          labels:
            severity: critical
            component: external-secrets
          annotations:
            summary: "External Secrets Operator sync failure"
            description: "External Secrets Operator has failed to sync secrets for the last 10 minutes"

        - alert: ExternalSecretsHighLatency
          expr: |
            histogram_quantile(0.95, external_secrets_secret_sync_duration_seconds_bucket) > 30
          for: 10m
          labels:
            severity: warning
            component: external-secrets
          annotations:
            summary: "External Secrets Operator high sync latency"
            description: "External Secrets Operator sync latency is high (p95 > 30s) for the last 10 minutes"

        - alert: ExternalSecretsCacheLowHitRate
          expr: |
            rate(external_secrets_secret_cache_hits_total[5m]) / (rate(external_secrets_secret_cache_hits_total[5m]) + rate(external_secrets_secret_cache_misses_total[5m])) < 0.5
          for: 15m
          labels:
            severity: info
            component: external-secrets
          annotations:
            summary: "External Secrets Operator low cache hit rate"
            description: "External Secrets Operator cache hit rate is low (< 50%) for the last 15 minutes"
{{- end }}
