global:
  namespace: nullnode-platform
  hostSuffix: nullnode.localhost
  ingressClassName: traefik
  storageClass: local-path

image:
  repository: ghcr.io/open-webui/open-webui
  # Pinned like everything else. `main` silently changes the UI between two
  # `make up`. See docs/ops/VERSIONS.md.
  tag: "v0.11.4"
  pullPolicy: IfNotPresent

# One replica on purpose. Open WebUI keeps users, chats and sessions in a
# SQLite file on its own volume; a second replica gets a second database and
# rejects the first one's session tokens.
replicaCount: 1

persistence:
  enabled: true
  size: 4Gi

service:
  port: 8080

ingress:
  enabled: true
  hostPrefix: chat

litellm:
  gatewayUrl: http://litellm.nullnode-platform.svc.cluster.local:4000/v1
  # Synced by External Secrets; the keys are hyphenated, matching what the
  # gateway Deployment reads from the same Secret.
  authSecret: nullnode-litellm-credentials
  masterKeyKey: master-key
  # Signs session cookies. Taken from the same Secret so it survives a
  # restart - a generated one logs everybody out on every rollout.
  sessionKeyKey: salt-key

# Must match one of the departments in the LiteLLM chart.
defaultDepartment: engineering

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

networkPolicy:
  enabled: false
