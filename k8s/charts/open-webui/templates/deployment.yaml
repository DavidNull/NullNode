apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-webui.fullname" . }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
    nullnode.io/component: chat-ui
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "open-webui.selectorLabels" . | nindent 6 }}
  # Recreate, not RollingUpdate: the data volume is ReadWriteOnce, so a surge
  # pod would sit unschedulable waiting for the outgoing one to release it.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "open-webui.labels" . | nindent 8 }}
        nullnode.io/component: chat-ui
      annotations:
        secret.reloader.stakater.com/reload: "{{ .Values.litellm.authSecret }}"
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-litellm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              for _ in $(seq 1 60); do
                if wget -q --spider --timeout=3 {{ .Values.litellm.gatewayUrl }}/models; then
                  echo "litellm gateway reachable"; exit 0
                fi
                echo "waiting for litellm gateway..."; sleep 5
              done
              echo "litellm gateway never became reachable" >&2; exit 1
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
      containers:
        - name: open-webui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: OPENAI_API_BASE_URL
              value: {{ .Values.litellm.gatewayUrl | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellm.authSecret }}
                  key: {{ .Values.litellm.masterKeyKey }}
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellm.authSecret }}
                  key: {{ .Values.litellm.sessionKeyKey }}
            - name: DEFAULT_DEPARTMENT
              value: {{ .Values.defaultDepartment | quote }}
            - name: ANONYMIZED_TELEMETRY
              value: "False"
            - name: WEBUI_NAME
              value: "NullNode Chat"
            - name: DATA_DIR
              value: /app/backend/data
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "open-webui.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      terminationGracePeriodSeconds: 30
