apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "litellm.fullname" . }}-config
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Rendered by Helm - edit values.yaml, not this.
    # `os.environ/NAME` is resolved by LiteLLM at runtime, so no credential
    # lands in this ConfigMap.

    model_list:
      {{- range $.Values.models }}
      - model_name: {{ .name }}
        litellm_params:
          {{/* Models may override api_base. */}}
          {{- $params := merge (deepCopy .params) (dict "api_base" $.Values.ollama.apiBase) }}
          {{- toYaml $params | nindent 10 }}
        {{- with .info }}
        model_info:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}

    router_settings:
      routing_strategy: {{ .Values.router.strategy }}
      num_retries: {{ .Values.router.numRetries }}
      timeout: {{ .Values.router.timeoutSeconds }}
      allowed_fails: {{ .Values.router.allowedFails }}
      cooldown_time: {{ .Values.router.cooldownSeconds }}
      # Shared state: without it, least-busy and the rate limit counters are
      # per-pod, and therefore wrong.
      redis_host: os.environ/REDIS_HOST
      redis_port: os.environ/REDIS_PORT
      redis_password: os.environ/REDIS_PASSWORD
      # Reject over-long requests before paying for the model round trip.
      enable_pre_call_checks: true

    litellm_settings:
      # Drop parameters the provider does not accept instead of 400-ing.
      drop_params: true
      request_timeout: {{ .Values.router.timeoutSeconds }}
      num_retries: {{ .Values.router.numRetries }}
      json_logs: true
      {{- if .Values.cache.enabled }}
      cache: true
      cache_params:
        type: redis
        host: os.environ/REDIS_HOST
        port: os.environ/REDIS_PORT
        password: os.environ/REDIS_PASSWORD
        namespace: {{ .Values.cache.namespace }}
        ttl: {{ .Values.cache.ttlSeconds }}
        supported_call_types:
          - acompletion
          - completion
          - atext_completion
          - aembedding
      {{- end }}
      callbacks:
        # TTFT, tokens, spend, remaining budget. If the pinned build gates
        # this, the pod still starts and the dashboards fall back to
        # spanmetrics. See docs/adr/0006-metrics-sources.md
        - prometheus
        {{- if .Values.global.otel.enabled }}
        - otel
        {{- end }}
      {{- if .Values.audit.enabled }}
      success_callback:
        - s3
      failure_callback:
        - s3
      s3_callback_params:
        s3_bucket_name: {{ .Values.global.aws.vaultBucket }}
        s3_region_name: {{ .Values.global.aws.region }}
        s3_endpoint_url: {{ .Values.global.aws.endpoint }}
        s3_path: {{ .Values.audit.prefix }}
      {{- end }}

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      # Teams, keys and budgets in Postgres: survive a restart, changeable
      # by API without a redeploy.
      store_model_in_db: true
      background_health_checks: true
      health_check_interval: 300
      # One INSERT per request would melt a laptop Postgres.
      proxy_batch_write_at: 60

    {{- if .Values.guardrails.pii.enabled }}
    guardrails:
      - guardrail_name: pii-presidio
        litellm_params:
          guardrail: presidio
          mode: {{ .Values.guardrails.pii.mode }}
          default_on: true
          pii_entities_config:
            {{- range .Values.guardrails.pii.entities }}
            {{ . }}: MASK
            {{- end }}
    {{- end }}
