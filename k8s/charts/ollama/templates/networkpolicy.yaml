{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ollama.fullname" . }}
  labels:
    {{- include "ollama.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ollama.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Traefik lives in kube-system on k3s.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.namespace | default "nullnode-platform" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.observabilityNamespace }}
      ports:
        - port: {{ .Values.service.port }}
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow outbound to LiteLLM gateway (if needed for callbacks)
    - to:
        - podSelector:
            matchLabels:
              nullnode.io/component: gateway
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.namespace | default "nullnode-platform" }}
      ports:
        - port: 4000
{{- end }}
