apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ollama.fullname" . }}
  labels:
    {{- include "ollama.labels" . | nindent 4 }}
    nullnode.io/component: inference
spec:
  serviceName: {{ include "ollama.fullname" . }}
  # KEDA owns the replica count once the ScaledObject exists.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.autoscaling.minReplicas }}
  {{- end }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "ollama.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ollama.labels" . | nindent 8 }}
        nullnode.io/component: inference
      annotations:
        nullnode.io/models: {{ join "," .Values.models | quote }}
    spec:
      {{- if and .Values.gpu.enabled .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Ready must mean "has its models". A postStart hook cannot do this:
      # there is no server to talk to yet.
      initContainers:
        - name: preload-models
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: HOME
              value: /models
            - name: OLLAMA_MODELS
              value: /models/.ollama/models
            - name: OLLAMA_HOST
              value: "127.0.0.1:{{ .Values.service.port }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ollama serve &
              server_pid=$!
              ready=0
              for _ in $(seq 1 60); do
                if ollama list >/dev/null 2>&1; then ready=1; break; fi
                sleep 2
              done
              if [ "$ready" -ne 1 ]; then
                echo "ollama did not come up; cannot pre-pull" >&2
                exit 1
              fi
              {{- range .Values.models }}
              echo "==> pulling {{ . }}"
              ollama pull {{ . | quote }}
              {{- end }}
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              echo "==> preload complete"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: ollama
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: HOME
              value: /models
            - name: OLLAMA_MODELS
              value: /models/.ollama/models
            - name: OLLAMA_HOST
              value: "0.0.0.0:{{ .Values.service.port }}"
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            # A busy generation briefly starves the HTTP loop; a tight probe
            # restarts pods mid-inference.
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              {{- toYaml .Values.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.resources.limits | nindent 14 }}
              {{- if .Values.gpu.enabled }}
              # Exclusive claim - no fractional GPU. Hence maxReplicas 1.
              nvidia.com/gpu: {{ .Values.gpu.count }}
              {{- end }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.persistence.enabled }}
        - name: models
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Let in-flight generations finish.
      terminationGracePeriodSeconds: 60
  {{- if .Values.persistence.enabled }}
  # One claim per replica: local-path is ReadWriteOnce, so no shared cache.
  # Cost is re-pulling per replica.
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
