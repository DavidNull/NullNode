# These defaults keep the chart renderable standalone. The platform chart
# overrides `global` at deploy time.
global:
  namespace: nullnode-platform
  hostSuffix: nullnode.localhost
  storageClass: local-path
  monitoring:
    enabled: true
    releaseLabel: kube-prometheus-stack

image:
  repository: redis
  tag: "7.4-alpine"
  pullPolicy: IfNotPresent

# One instance: replicas would make eviction unpredictable. Scale the
# gateway instead.
replicaCount: 1

config:
  maxmemory: 512mb
  maxmemoryPolicy: allkeys-lru
  # Durability off: anything lost is recomputed by re-running the prompt.
  appendonly: "no"
  save: ""

auth:
  enabled: true
  # Built by platform-bootstrap. Never generated by this chart.
  existingSecret: nullnode-redis-auth
  passwordKey: redis-password

persistence:
  enabled: false
  size: 2Gi

service:
  port: 6379

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 768Mi

metrics:
  enabled: true
  image:
    repository: oliver006/redis_exporter
    tag: "v1.66.0"
  port: 9121
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

networkPolicy:
  # Off by default: a silently blocked cache is hard to diagnose. Turn on
  # once the platform is known good.
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
