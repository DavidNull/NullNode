apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.fullname" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    port {{ .Values.service.port }}
    maxmemory {{ .Values.config.maxmemory }}
    maxmemory-policy {{ .Values.config.maxmemoryPolicy }}
    appendonly {{ .Values.config.appendonly }}
    save {{ .Values.config.save | quote }}
    # Many small keys: lazy eviction keeps a synchronous free() out of the
    # p99 of a cache write.
    lazyfree-lazy-eviction yes
    lazyfree-lazy-expire yes
