{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redis.fullname" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "redis.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # The gateway and the KEDA scaler.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: nullnode
      ports:
        - port: {{ .Values.service.port }}
    # Prometheus scrapes from another namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.observabilityNamespace | default "nullnode-observability" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - port: {{ .Values.metrics.port }}
        - port: {{ .Values.service.port }}
{{- end }}
