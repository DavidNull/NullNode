# The mocked Secrets Manager, as ESO sees it. The endpoint is not set here:
# the AWS provider has no endpoint field, so the controller is pointed at
# LocalStack via AWS_SECRETSMANAGER_ENDPOINT (k8s/platform/values/external-secrets.yaml).
# Cluster-scoped so the ExternalSecrets in both namespaces share one store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  labels:
    {{- include "external-secrets-config.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.global.aws.region | quote }}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: {{ .Values.global.aws.credentialsSecret }}
            namespace: {{ .Values.global.namespace }}
            key: access-key-id
          secretAccessKeySecretRef:
            name: {{ .Values.global.aws.credentialsSecret }}
            namespace: {{ .Values.global.namespace }}
            key: secret-access-key
