# The static test/test access keys. Formerly created by platform-bootstrap;
# now in git because ESO needs them to authenticate to the mocked Secrets
# Manager, and they are not credential-shaped. Consumed by the gateway (S3
# audit log) and by the ClusterSecretStore below.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.aws.credentialsSecret }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "external-secrets-config.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key-id: {{ .Values.awsCredentials.accessKeyId | quote }}
  secret-access-key: {{ .Values.awsCredentials.secretAccessKey | quote }}
