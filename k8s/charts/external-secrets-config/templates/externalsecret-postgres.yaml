# Postgres password -> nullnode-postgres-auth (postgres-password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nullnode-postgres-auth
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "external-secrets-config.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: ClusterSecretStore
  target:
    name: nullnode-postgres-auth
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: {{ .Values.platformSecretId | quote }}
        property: postgres_password
