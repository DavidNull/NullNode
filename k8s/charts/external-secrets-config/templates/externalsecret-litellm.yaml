# Gateway identity keys -> nullnode-litellm-credentials (master-key, salt-key),
# the same Secret and keys the deployment reads via secretKeyRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nullnode-litellm-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "external-secrets-config.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: ClusterSecretStore
  target:
    name: nullnode-litellm-credentials
    creationPolicy: Owner
  data:
    - secretKey: master-key
      remoteRef:
        key: {{ .Values.platformSecretId | quote }}
        property: master_key
    - secretKey: salt-key
      remoteRef:
        key: {{ .Values.platformSecretId | quote }}
        property: salt_key
