# Grafana admin -> nullnode-grafana-admin in the observability namespace.
# admin-user is a static literal; only the password comes from Secrets Manager,
# so the target is assembled with an ESO template. The backticks stop Helm from
# evaluating the ESO placeholder.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nullnode-grafana-admin
  namespace: {{ .Values.global.observabilityNamespace }}
  labels:
    {{- include "external-secrets-config.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: ClusterSecretStore
  target:
    name: nullnode-grafana-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: {{ `"{{ .adminPassword }}"` }}
  data:
    - secretKey: adminPassword
      remoteRef:
        key: {{ .Values.platformSecretId | quote }}
        property: grafana_password
