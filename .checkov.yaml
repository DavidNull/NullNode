# Checkov configuration. Runs over infra/terraform and the rendered manifests.
directory:
  - infra/terraform

framework:
  - terraform
  - dockerfile

quiet: true
compact: true

skip-check:
  # --- mocked cloud: these controls have no meaning against LocalStack -----
  # KMS-encrypted S3: LocalStack Community has no KMS.
  - CKV_AWS_145
  # S3 access logging: logging a mock bucket into another mock bucket.
  - CKV_AWS_18
  # Cross-region replication: there is one region and it is fake.
  - CKV_AWS_144
  # Secrets Manager KMS key: same reason as above.
  - CKV_AWS_149
  # S3 event notifications / lifecycle on all prefixes: the lifecycle rule is
  # deliberately scoped to audit/ only.
  - CKV2_AWS_61
  # S3 event notifications need an SNS/SQS/Lambda target; there is none on the
  # mock and nothing consumes bucket events in the lab.
  - CKV2_AWS_62
  # Abort-incomplete-multipart lifecycle: adding a second lifecycle rule is what
  # makes LocalStack's lifecycle API hang in CI, and it buys nothing on a mock.
  - CKV_AWS_300
  # Secrets Manager automatic rotation needs a rotation Lambda, which LocalStack
  # Community does not run. Rotation is covered by the ADR-0005 flow instead.
  - CKV2_AWS_57
  # --- local lab -----------------------------------------------------------
  # Provider version pinning is done in versions.tf with ~> constraints, which
  # Checkov does not always recognise.
  - CKV_TF_1
